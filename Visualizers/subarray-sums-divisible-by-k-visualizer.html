<script>
/* dsa-visualizer trace core — shared by the page and by scripts/build.js (no DOM here). */
(function (root) {
  const MAX_STEPS = 1500;
  const TYPES = ['array', 'string', 'bars', 'grid', 'map', 'set', 'stack', 'queue', 'tree', 'list', 'graph', 'text'];
  const MARKS = ['active', 'compare', 'done', 'found', 'bad', 'dim', 'visited', 'path'];

  // Code lines may end with a tag comment like  `# @loop`  or  `// @loop`.
  // Tags are stripped for display and let solve() refer to lines by name.
  function parseCode(src) {
    const raw = String(src || '').replace(/\t/g, '    ').replace(/^\s*\n/, '').replace(/\s+$/, '');
    const lines = raw.split('\n');
    const tags = {};
    const out = lines.map((ln, i) => {
      const m = ln.match(/\s*(?:#|\/\/)\s*@([A-Za-z_][\w-]*)\s*$/);
      if (m) { tags[m[1]] = i + 1; return ln.slice(0, m.index); }
      return ln;
    });
    // de-indent common leading whitespace
    const ind = Math.min(...out.filter(l => l.trim()).map(l => l.match(/^ */)[0].length));
    return { lines: out.map(l => l.slice(isFinite(ind) ? ind : 0)), tags };
  }

  function clone(v) {
    if (v === undefined) return undefined;
    try { return structuredClone(v); } catch (e) { return JSON.parse(JSON.stringify(v)); }
  }

  function buildTree(arr) {
    if (!arr || !arr.length || arr[0] == null) return null;
    let id = 0;
    const mk = v => ({ id: id++, val: v, left: null, right: null });
    const r = mk(arr[0]); const q = [r]; let i = 1;
    while (q.length && i < arr.length) {
      const n = q.shift();
      if (i < arr.length && arr[i] != null) { n.left = mk(arr[i]); q.push(n.left); } i++;
      if (i < arr.length && arr[i] != null) { n.right = mk(arr[i]); q.push(n.right); } i++;
    }
    return r;
  }
  function treeToArray(r) {
    const out = []; const q = [r];
    while (q.length) { const n = q.shift(); if (n) { out.push(n.val); q.push(n.left, n.right); } else out.push(null); }
    while (out.length && out[out.length - 1] == null) out.pop();
    return out;
  }
  function buildList(arr, cyclePos = -1) {
    const nodes = (arr || []).map((v, i) => ({ id: i, val: v, next: null }));
    nodes.forEach((n, i) => { n.next = nodes[i + 1] || null; });
    if (cyclePos >= 0 && nodes.length) nodes[nodes.length - 1].next = nodes[cyclePos];
    return nodes[0] || null;
  }
  function listToArray(h) {
    const out = []; const seen = new Set();
    while (h && !seen.has(h) && out.length < 10000) { seen.add(h); out.push(h.val); h = h.next; }
    return out;
  }

  const DATA_KEY = { array: 'values', string: 'values', bars: 'values', stack: 'values', queue: 'values', set: 'values', grid: 'cells', map: 'entries', tree: 'root', text: 'value' };
  function view(type) {
    return function (name, data, opts) {
      const o = { type, name };
      if (type === 'graph') Object.assign(o, data || {});
      else if (type === 'list') { if (Array.isArray(data)) o.values = data; else o.head = data; }

      pos[id] = p ? [30 + p[0]*(Wd-60), 30 + p[1]*(Ht-60)] : [Wd/2 + (Wd/2-40)*Math.cos(2*Math.PI*i/n - Math.PI/2), Ht/2 + (Ht/2-36)*Math.sin(2*Math.PI*i/n - Math.PI/2)]; });

      if (wt != null) g += `<text x="${(x1+x2)/2}" y="${(y1+y2)/2-5}" text-anchor="middle" font-size="10.5" style="fill:var(--ink-2)">${esc(fmt(wt))}</text>`;

      g += `<text x="${x}" y="${y+4}" text-anchor="middle" font-size="12" font-weight="600">${esc(s.labels && s.labels[id] != null ? s.labels[id] : id)}</text>`;
      if (s.info && s.info[id] != null) g += `<text x="${x}" y="${y+31}" text-anchor="middle" font-size="10" style="fill:var(--ink-2)">${esc(fmt(s.info[id]))}</text>`;
      if (ptrs[id]) g += `<text x="${x}" y="${y-23}" text-anchor="middle" font-size="10" font-weight="600" style="fill:var(--m-active)">${esc(ptrs[id].join(','))}</text>`;

function renderStruct(s){

}

/* ---------- custom input parsing ---------- */
function parseField(type, raw){
  raw = String(raw).trim();
  if (type === 'int' || type === 'float' || type === 'number') { const n = Number(raw); if (raw === '' || Number.isNaN(n)) throw new Error('expected a number'); if (type === 'int' && !Number.isInteger(n)) throw new Error('expected an integer'); return n; }
  if (type === 'string' || type === 'char') { if (/^(["']).*\1$/.test(raw)) raw = raw.slice(1, -1); return raw; }
  if (type === 'bool') { if (!/^(true|false)$/i.test(raw)) throw new Error('expected true or false'); return /^true$/i.test(raw); }
  let txt = raw.replace(/'/g, '"');
  try { return JSON.parse(txt); } catch(e) { throw new Error('could not read this as JSON, e.g. [1,2,3]'); }
}
function showField(type, v){ return (type === 'string' || type === 'char') ? v : JSON.stringify(v); }

/* ---------- player ---------- */
const SPEEDS = [{l:'0.5×', ms:1400}, {l:'1×', ms:800}, {l:'2×', ms:400}, {l:'4×', ms:180}];
const LEGEND = {active:'current', compare:'comparing', found:'answer / match', done:'processed', bad:'rejected', visited:'visited', path:'on path'};
class Player {
  constructor(host, spec, opt){
    this.spec = spec; this.opt = opt || {}; this.k = 0; this.timer = null; this.speed = 1; this.listeners = [];
    this.code = C.parseCode(spec.code);
    this.root = el('div', {class:'player', tabindex:'0', 'aria-label':(opt.label||'Step-by-step visualizer')+' — use arrow keys to step'});
    host.append(this.root); this.build();
    const ex = (spec.examples || [])[0];
    if (ex) this.load(ex.input, ex.expected, 0);
  }
  build(){
    const s = this.spec;
    this.bar = el('div', {class:'p-bar'}, el('span', {class:'lbl', text:'Input'}));
    this.exBtns = (s.examples||[]).map((ex, i) => el('button', {class:'btn', type:'button', onclick:() => { this.custom.hidden = true; this.load(ex.input, ex.expected, i); }}, ex.label || ('Example '+(i+1))));
    this.bar.append(...this.exBtns);
    this.customBtn = null;
    this.custom = el('div', {class:'p-custom', hidden:true});
    if (this.opt.custom !== false && s.inputs && s.inputs.length) {
      this.customBtn = el('button', {class:'btn', type:'button', onclick:() => { this.custom.hidden = !this.custom.hidden; this.markBtn(); if (!this.custom.hidden) this.custom.querySelector('input')?.focus(); }}, 'Your own input');
      this.bar.append(this.customBtn);
      const ex0 = (s.examples||[])[0] || {input:{}};
      const fields = s.inputs.map(inp => el('label', {}, `${inp.label || inp.name}  ·  ${inp.type}`,
        el('input', {id:(this.opt.id||'p')+'-in-'+inp.name, 'data-name':inp.name, value: ex0.input[inp.name] !== undefined ? showField(inp.type, ex0.input[inp.name]) : '', spellcheck:'false', autocomplete:'off'})));
      this.err = el('div', {class:'err', role:'status'});
      const run = el('button', {class:'btn primary', type:'button', onclick:() => this.runCustom()}, 'Visualize this input');
      this.custom.append(el('div', {class:'fields'}, fields), el('div', {class:'meta'}, run, el('span', {class:'kbd', text:'Keep inputs small (≈ up to 20 elements) so every step stays readable.'})), this.err);
      this.custom.addEventListener('keydown', e => { if (e.key === 'Enter') this.runCustom(); });
    }
    this.stage = el('div', {class:'p-stage'});
    this.codeEl = codeBlock(this.code.lines);
    const side = el('div', {class:'p-side'}, el('div', {class:'code-head'}, el('span', {text: s.language || 'Java'}), el('span', {text:'line highlights follow the steps'})), this.codeEl);
    this.prev = el('button', {class:'btn', type:'button', 'aria-label':'Previous step', onclick:() => this.go(this.k-1)}, '◀ Prev');
    this.next = el('button', {class:'btn', type:'button', 'aria-label':'Next step', onclick:() => this.go(this.k+1)}, 'Next ▶');
    this.play = el('button', {class:'btn primary', type:'button', onclick:() => this.toggle()}, '▶ Play');
    this.first = el('button', {class:'btn', type:'button', 'aria-label':'First step', onclick:() => this.go(0)}, '⏮');
    this.last = el('button', {class:'btn', type:'button', 'aria-label':'Last step', onclick:() => this.go(this.trace.steps.length-1)}, '⏭');
    this.range = el('input', {type:'range', min:'0', max:'0', value:'0', 'aria-label':'Scrub steps', id:(this.opt.id||'p')+'-scrub', oninput:e => this.go(+e.target.value)});
    this.spd = el('select', {'aria-label':'Speed', id:(this.opt.id||'p')+'-speed', onchange:e => { this.speed = +e.target.value; if (this.timer) { this.stop(); this.toggle(); } }}, SPEEDS.map((x, i) => el('option', {value:i, selected: i===1}, x.l)));
    const ctl = el('div', {class:'p-ctl'}, this.first, this.prev, this.play, this.next, this.last, this.range, this.spd, el('span', {class:'kbd', text:'← → step · space play'}));
    this.io = el('div', {class:'p-io'});
    this.root.append(this.bar, this.io, this.custom, el('div', {class:'p-main'}, this.stage, side), ctl);
    this.root.addEventListener('keydown', e => {
      if (e.target.tagName === 'INPUT' && e.target.type !== 'range') return;
      if (e.target.tagName === 'SELECT') return;
      if (e.key === 'ArrowRight') { e.preventDefault(); this.go(this.k+1); }
      else if (e.key === 'ArrowLeft') { e.preventDefault(); this.go(this.k-1); }
      else if (e.key === ' ' && e.target.tagName !== 'BUTTON') { e.preventDefault(); this.toggle(); }
    });
  }
  markBtn(){ this.exBtns.forEach((b, i) => b.setAttribute('aria-pressed', String(this.exIndex === i))); if (this.customBtn) this.customBtn.setAttribute('aria-pressed', String(this.exIndex === -1 || !this.custom.hidden)); }
  runCustom(){
    const input = {}; this.err.textContent = '';
    try {
      for (const inp of this.spec.inputs) { const f = this.custom.querySelector(`[data-name="${inp.name}"]`);
        try { input[inp.name] = parseField(inp.type, f.value); } catch(e) { throw new Error(`${inp.label || inp.name}: ${e.message}`); } }
      const lim = this.spec.maxSize || 40;
      for (const [k, v] of Object.entries(input)) if ((Array.isArray(v) && v.length > lim) || (typeof v === 'string' && v.length > lim)) throw new Error(`${k}: keep it to ${lim} elements or fewer so the steps stay readable.`);

  }
  load(input, expected, exIndex){
    this.stop(); this.exIndex = exIndex; this.input = input; this.expected = expected;

    this.range.max = String(this.trace.steps.length - 1);

    this.io.innerHTML = '<b>input</b> ' + esc(ioTxt) + (expected !== undefined ? '   <b>→ expected</b> ' + esc(JSON.stringify(expected)) : '');
    const note = exIndex >= 0 && (this.spec.examples[exIndex] || {}).note;

  go(k, force){

  toggle(){ if (this.timer) return this.stop(); if (this.k >= this.trace.steps.length-1) this.go(0);

  stop(){ if (this.timer) clearInterval(this.timer); this.timer = null; if (this.play) this.play.textContent = '▶ Play'; }
  render(){
    const t = this.trace, st = t.steps[this.k], prev = t.steps[this.k-1], n = t.steps.length;

    const vk = Object.keys(st.vars || {});

      }

}

/* ---------- page sections ---------- */
const diffCls = d => String(d||'').toLowerCase();
function head(sec, eyebrow, title, sub){ sec.append(el('div', {class:'sec-head'}, el('span', {class:'eyebrow', text:eyebrow}), el('h2', {text:title}), sub ? el('p', {class:'muted', html:sub}) : null)); }

// header
$('#top').append(
  el('span', {class:'eyebrow', text:[P.source || 'Problem', P.id != null ? '#'+P.id : null].filter(Boolean).join(' · ')}),
  el('h1', {text:P.title}),

  if (P.approaches && P.approaches.length) sec.append(el('div', {class:'approaches'}, P.approaches.map(a => el('div', {class:'appr'+(a.best?' best':'')},
    el('div', {class:'meta', style:{justifyContent:'space-between'}}, el('h3', {text:a.name}), a.best ? el('span', {class:'chip', style:{borderColor:'var(--accent)', color:'var(--accent)'}, text:'visualized below'}) : null),
    el('p', {html:a.idea}), el('div', {class:'cx'}, el('span', {class:'chip', text:'time '+a.time}), el('span', {class:'chip', text:'space '+a.space})),
    a.tradeoff ? el('p', {class:'muted', style:{fontSize:'.88rem'}, html:a.tradeoff}) : null))));

// visualizer + dry run
let main;
(function(){
  const sec = $('#visualize'); head(sec, 'Interactive', 'Watch the solution run', 'Pick an example or type your own input, then step through. The highlighted code line, the variables and the data structures all move together.');
  main = new Player(sec, P, {id:'main', label:P.title+' visualizer'});
  const dsec = $('#dryrun'); head(dsec, 'Dry run', 'Every step, in one table', 'Generated from the same run as the visualizer. Click a row to jump there.');
  const wrap = el('div', {class:'tablewrap'}); dsec.append(wrap);
  const cap = el('p', {class:'muted', style:{fontSize:'.88rem'}}); dsec.append(cap);
  let rows = [];
  function build(){
    const t = main.trace; wrap.textContent = ''; rows = [];
    const tb = el('tbody');
    const LIM = 400;
    t.steps.slice(0, LIM).forEach((st, i) => {
      const pv = t.steps[i-1];
      const state = Object.keys(st.vars||{}).map(k => { const chg = pv && fmt(pv.vars[k]) !== fmt(st.vars[k]); return (chg ? '<b>' : '') + esc(k+'='+fmt(st.vars[k])) + (chg ? '</b>' : ''); }).join('  ');
      const tr = el('tr', {onclick:() => { main.go(i); main.root.scrollIntoView({block:'start'}); }},
        el('td', {class:'st', text:String(i+1)}), el('td', {class:'st', text: st.line ? String(st.line) : '–'}),
        el('td', {class:'st', html: state || '–'}), el('td', {html: esc(st.msg).replace(/`([^`]+)`/g, '<code>$1</code>')}));
      rows.push(tr); tb.append(tr);
    });
    wrap.append(el('table', {class:'dry'}, el('thead', {}, el('tr', {}, el('th', {text:'#'}), el('th', {text:'Line'}), el('th', {text:'State after step'}), el('th', {text:'What happens'}))), tb));
    const lbl = main.exIndex >= 0 ? ((P.examples[main.exIndex]||{}).label || 'Example') : 'your input';
    cap.textContent = `Dry run of ${lbl}: ${t.steps.length} steps${t.steps.length > LIM ? ` (first ${LIM} shown)` : ''}. Bold values changed on that step.`;

document.addEventListener('keydown', e => {
