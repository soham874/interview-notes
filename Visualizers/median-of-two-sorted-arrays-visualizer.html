<style>

}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){

  --accent:#3CC3CF; --accent-ink:#06282C; --accent-soft:#143339;
  --m-active:#FF8A4C; --m-compare:#5AA2F5; --m-done:#4F7C84; --m-found:#4CC46C; --m-bad:#FF6464; --m-visited:#B08CF5; --m-path:#E8B53A;
  --water:#3E8FD6; --code-bg:#0A0F15; --code-hl:#1F3043;
  --easy:#4CC46C; --medium:#E8B53A; --hard:#FF6464;
}}
:root[data-theme="dark"]{
  --bg:#0D1219; --surface:#151C26; --surface-2:#1D2632; --ink:#E5EAF1; --ink-2:#A2ADBD; --ink-3:#6F7C8F; --line:#28323F;
  --accent:#3CC3CF; --accent-ink:#06282C; --accent-soft:#143339;
  --m-active:#FF8A4C; --m-compare:#5AA2F5; --m-done:#4F7C84; --m-found:#4CC46C; --m-bad:#FF6464; --m-visited:#B08CF5; --m-path:#E8B53A;
  --water:#3E8FD6; --code-bg:#0A0F15; --code-hl:#1F3043;
  --easy:#4CC46C; --medium:#E8B53A; --hard:#FF6464;
}

[hidden]{display:none!important}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){ html{scroll-behavior:auto} *{transition:none!important;animation:none!important} }
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 var(--f-body);-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding-inline:clamp(16px,4vw,40px);padding-block:0 64px}
a{color:var(--accent)}

:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}

p{margin:0}

.muted{color:var(--ink-2)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:.8rem;color:var(--ink-2);white-space:nowrap}
.diff{font-weight:600;border-color:currentColor;background:transparent}

nav.toc ul{list-style:none;margin:0;padding:10px 0;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}

section>*,.algo>*,.grid2>*{min-width:0}
section,.algo,.player,.panel,.p-stage,.grid2>div{grid-template-columns:minmax(0,1fr)}
.cx .chip{white-space:normal;max-width:100%}

/* problem */
.two{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:20px}

.ex:first-child{border-top:0;padding-top:0}
.ex .io{font-family:var(--f-mono);font-size:.84rem;overflow-x:auto;white-space:pre}
ul.plain{margin:0;padding-left:18px;display:grid;gap:4px}

/* approach */
.hints{display:grid;gap:8px}
.hint{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}

.approaches{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.appr{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:grid;gap:8px;align-content:start}
.appr.best{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.appr .cx{display:flex;gap:8px;flex-wrap:wrap}
.cx .chip{font-family:var(--f-mono);font-size:.76rem}
.insight{border-left:3px solid var(--accent);padding:10px 16px;background:var(--accent-soft);border-radius:0 var(--r) var(--r) 0;max-width:80ch}

/* player */
.player{scroll-margin-top:64px;background:var(--surface);border:1px solid var(--line);border-radius:14px;display:grid;overflow:hidden;min-width:0}
.player:focus-visible{outline-offset:-2px}
.p-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.p-bar .lbl{font-size:.8rem;color:var(--ink-3);margin-right:4px}
.p-custom{display:grid;gap:10px;padding:14px;border-bottom:1px solid var(--line)}
.p-custom .fields{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.p-custom label{display:grid;gap:4px;font-size:.8rem;color:var(--ink-2)}
.p-custom input{font:0.88rem var(--f-mono);padding:8px 10px;border-radius:7px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%}

.p-main{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);min-height:360px}
@media (max-width:900px){.p-main{grid-template-columns:minmax(0,1fr)}}
.p-stage{padding:16px;display:grid;gap:14px;align-content:start;min-width:0;border-right:1px solid var(--line)}
@media (max-width:900px){.p-stage{border-right:0;border-bottom:1px solid var(--line)}}
.p-side{display:grid;grid-template-rows:auto 1fr;min-width:0;background:var(--code-bg)}
.narr{display:grid;gap:4px;padding:12px 14px;border-radius:var(--r);background:var(--accent-soft);min-height:64px}

.narr .msg{font-size:.98rem}
.vars{display:flex;flex-wrap:wrap;gap:6px}
.var{font:.8rem var(--f-mono);padding:4px 9px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line)}
.var b{color:var(--ink-3);font-weight:400}
.var.chg{border-color:var(--m-active);background:color-mix(in srgb,var(--m-active) 14%,var(--surface))}
.struct{display:grid;gap:6px;min-width:0}
.struct .sname{font:600 .74rem/1 var(--f-mono);color:var(--ink-3);letter-spacing:.04em}
.scroll{overflow-x:auto;padding-bottom:4px}
.result{padding:10px 14px;border-radius:var(--r);font-weight:500;border:1px solid var(--line)}
.result.ok{border-color:var(--m-found);color:var(--m-found)}

.p-ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.p-ctl input[type=range]{flex:1 1 160px;accent-color:var(--accent);min-width:120px}
.p-ctl select{font:.85rem var(--f-body);padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}

.code{font:.82rem/1.65 var(--f-mono);color:var(--code-ink);background:var(--code-bg);overflow:auto;padding:10px 0;margin:0;counter-reset:ln}
.code .ln{display:block;padding:0 14px 0 0;white-space:pre;border-left:3px solid transparent}
.code .ln::before{counter-increment:ln;content:counter(ln);display:inline-block;width:3.2em;padding-right:1em;text-align:right;color:var(--code-num)}
.code .ln.on{background:var(--code-hl);border-left-color:var(--m-active)}
.code-head{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;font:.74rem var(--f-mono);color:var(--code-num);border-bottom:1px solid #ffffff14}
.tk-kw{color:var(--tk-kw)} .tk-str{color:var(--tk-str)} .tk-num{color:var(--tk-num)} .tk-com{color:var(--tk-com);font-style:italic} .tk-fn{color:var(--tk-fn)}

.ptrs{display:flex;flex-direction:column-reverse;align-items:center;gap:2px;min-height:18px}
.ptr{font:600 .68rem/1 var(--f-mono);color:var(--m-active);padding:2px 5px;border-radius:4px;background:color-mix(in srgb,var(--m-active) 14%,transparent)}
.ptr::after{content:" ↓"}
.ptr.cyc::after{content:none}
.cell{min-width:40px;height:40px;padding:0 6px;display:grid;place-items:center;border:1.5px solid var(--m,var(--line));border-radius:7px;background:color-mix(in srgb,var(--m,var(--line)) 16%,var(--surface));font:600 .9rem var(--f-mono);transition:background .25s,border-color .25s,transform .25s}

.idx{font:.66rem var(--f-mono);color:var(--ink-3)}

.m-active{--m:var(--m-active)} .m-compare{--m:var(--m-compare)} .m-done{--m:var(--m-done)} .m-found{--m:var(--m-found)} .m-bad{--m:var(--m-bad)} .m-visited{--m:var(--m-visited)} .m-path{--m:var(--m-path)}

.cell.m-active{transform:translateY(-3px)}

.pair{display:inline-flex;border:1.5px solid var(--m,var(--line));border-radius:7px;overflow:hidden;font:.84rem var(--f-mono);background:var(--surface)}

table.dry th{position:sticky;top:0;background:var(--surface-2);text-align:left;font:600 .72rem var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);padding:10px 12px;z-index:1}

.algo{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;display:grid;gap:14px}

<script>
/* dsa-visualizer trace core — shared by the page and by scripts/build.js (no DOM here). */
(function (root) {
  const MAX_STEPS = 1500;
  const TYPES = ['array', 'string', 'bars', 'grid', 'map', 'set', 'stack', 'queue', 'tree', 'list', 'graph', 'text'];
  const MARKS = ['active', 'compare', 'done', 'found', 'bad', 'dim', 'visited', 'path'];

  // Code lines may end with a tag comment like  `# @loop`  or  `// @loop`.
  // Tags are stripped for display and let solve() refer to lines by name.
  function parseCode(src) {
    const raw = String(src || '').replace(/\t/g, '    ').replace(/^\s*\n/, '').replace(/\s+$/, '');
    const lines = raw.split('\n');
    const tags = {};
    const out = lines.map((ln, i) => {
      const m = ln.match(/\s*(?:#|\/\/)\s*@([A-Za-z_][\w-]*)\s*$/);
      if (m) { tags[m[1]] = i + 1; return ln.slice(0, m.index); }
      return ln;
    });
    // de-indent common leading whitespace
    const ind = Math.min(...out.filter(l => l.trim()).map(l => l.match(/^ */)[0].length));
    return { lines: out.map(l => l.slice(isFinite(ind) ? ind : 0)), tags };
  }

  function clone(v) {
    if (v === undefined) return undefined;
    try { return structuredClone(v); } catch (e) { return JSON.parse(JSON.stringify(v)); }
  }

  function buildTree(arr) {
    if (!arr || !arr.length || arr[0] == null) return null;
    let id = 0;
    const mk = v => ({ id: id++, val: v, left: null, right: null });
    const r = mk(arr[0]); const q = [r]; let i = 1;
    while (q.length && i < arr.length) {
      const n = q.shift();
      if (i < arr.length && arr[i] != null) { n.left = mk(arr[i]); q.push(n.left); } i++;
      if (i < arr.length && arr[i] != null) { n.right = mk(arr[i]); q.push(n.right); } i++;
    }
    return r;
  }
  function treeToArray(r) {
    const out = []; const q = [r];
    while (q.length) { const n = q.shift(); if (n) { out.push(n.val); q.push(n.left, n.right); } else out.push(null); }
    while (out.length && out[out.length - 1] == null) out.pop();
    return out;
  }
  function buildList(arr, cyclePos = -1) {
    const nodes = (arr || []).map((v, i) => ({ id: i, val: v, next: null }));
    nodes.forEach((n, i) => { n.next = nodes[i + 1] || null; });
    if (cyclePos >= 0 && nodes.length) nodes[nodes.length - 1].next = nodes[cyclePos];
    return nodes[0] || null;
  }
  function listToArray(h) {
    const out = []; const seen = new Set();
    while (h && !seen.has(h) && out.length < 10000) { seen.add(h); out.push(h.val); h = h.next; }
    return out;
  }

  const DATA_KEY = { array: 'values', string: 'values', bars: 'values', stack: 'values', queue: 'values', set: 'values', grid: 'cells', map: 'entries', tree: 'root', text: 'value' };
  function view(type) {
    return function (name, data, opts) {
      const o = { type, name };
      if (type === 'graph') Object.assign(o, data || {});
      else if (type === 'list') { if (Array.isArray(data)) o.values = data; else o.head = data; }
      else if (type === 'string' && typeof data === 'string') o.values = data.split('');
      else o[DATA_KEY[type]] = data;
      return Object.assign(o, opts || {});
    };
  }

  function runTrace(spec, input) {
    const code = parseCode(spec.code);

      }
      if (t.truncated) stage.append(el('div', {class:'kbd', text:`Showing the first ${C.MAX_STEPS} steps — try a smaller input.`}));
    }
    [...this.codeEl.children].forEach((ln, i) => ln.classList.toggle('on', i+1 === st.line));
    const on = this.codeEl.children[st.line-1];
    if (on) { const top = on.offsetTop - this.codeEl.clientHeight/2; if (top < this.codeEl.scrollTop || on.offsetTop > this.codeEl.scrollTop + this.codeEl.clientHeight - 30) this.codeEl.scrollTop = Math.max(0, top); }
    this.range.value = String(this.k);
    this.prev.disabled = this.first.disabled = this.k === 0; this.next.disabled = this.last.disabled = this.k === n-1;
  }
}

/* ---------- page sections ---------- */
const diffCls = d => String(d||'').toLowerCase();
function head(sec, eyebrow, title, sub){ sec.append(el('div', {class:'sec-head'}, el('span', {class:'eyebrow', text:eyebrow}), el('h2', {text:title}), sub ? el('p', {class:'muted', html:sub}) : null)); }
function fmtIO(o){ return Object.entries(o).map(([k, v]) => `${k} = ${typeof v === 'string' ? JSON.stringify(v) : JSON.stringify(v)}`).join(', '); }

// header
$('#top').append(
  el('span', {class:'eyebrow', text:[P.source || 'Problem', P.id != null ? '#'+P.id : null].filter(Boolean).join(' · ')}),
  el('h1', {text:P.title}),
  el('div', {class:'meta'}, el('span', {class:'chip diff '+diffCls(P.difficulty), text:P.difficulty}), (P.tags||[]).map(t => el('span', {class:'chip', text:t})),
    P.url ? el('a', {class:'btn', href:P.url, target:'_blank', rel:'noopener'}, 'Open problem ↗') : null));

// problem
(function(){
  const sec = $('#problem'); head(sec, 'The problem', 'What we are solving');
  const left = el('div', {class:'panel'}, el('div', {class:'summary', html:P.summary}));
  if (P.constraints && P.constraints.length) left.append(el('div', {}, el('h3', {text:'Constraints', style:{fontSize:'.95rem', marginBottom:'6px'}}), el('ul', {class:'plain'}, P.constraints.map(c => el('li', {class:'mono', text:c})))));
  const right = el('div', {class:'panel'}, el('h3', {text:'Examples'}), (P.examples||[]).map(ex => el('div', {class:'ex'},
    el('span', {class:'eyebrow', text:ex.label}), el('div', {class:'io', text:'Input:  '+fmtIO(ex.input)}), el('div', {class:'io', text:'Output: '+JSON.stringify(ex.expected)}), ex.note ? el('p', {class:'muted', style:{fontSize:'.88rem'}, html:ex.note}) : null)));
  sec.append(el('div', {class:'two'}, left, right));
})();

// approach
(function(){
  const sec = $('#approach'); head(sec, 'Think it through', 'Approach', 'Reveal the hints one at a time — try to finish the idea yourself before opening the next.');
  if (P.hints && P.hints.length) sec.append(el('div', {class:'hints'}, P.hints.map((h, i) => {
    const body = el('div', {class:'body', 'data-locked':'true', html:h, title:'Click to reveal', role:'button', tabindex:'0'});
    const reveal = () => body.setAttribute('data-locked', 'false');
    body.addEventListener('click', reveal); body.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); reveal(); } });
    return el('div', {class:'hint'}, el('span', {class:'n', text:'HINT '+(i+1)}), body);
  })));
  if (P.insight) sec.append(el('div', {class:'insight', html:'<strong>Key insight.</strong> '+P.insight}));
  if (P.approaches && P.approaches.length) sec.append(el('div', {class:'approaches'}, P.approaches.map(a => el('div', {class:'appr'+(a.best?' best':'')},
    el('div', {class:'meta', style:{justifyContent:'space-between'}}, el('h3', {text:a.name}), a.best ? el('span', {class:'chip', style:{borderColor:'var(--accent)', color:'var(--accent)'}, text:'visualized below'}) : null),
    el('p', {html:a.idea}), el('div', {class:'cx'}, el('span', {class:'chip', text:'time '+a.time}), el('span', {class:'chip', text:'space '+a.space})),
    a.tradeoff ? el('p', {class:'muted', style:{fontSize:'.88rem'}, html:a.tradeoff}) : null))));
})();

// visualizer + dry run
let main;
(function(){
  const sec = $('#visualize'); head(sec, 'Interactive', 'Watch the solution run', 'Pick an example or type your own input, then step through. The highlighted code line, the variables and the data structures all move together.');
  main = new Player(sec, P, {id:'main', label:P.title+' visualizer'});
  const dsec = $('#dryrun'); head(dsec, 'Dry run', 'Every step, in one table', 'Generated from the same run as the visualizer. Click a row to jump there.');
  const wrap = el('div', {class:'tablewrap'}); dsec.append(wrap);
  const cap = el('p', {class:'muted', style:{fontSize:'.88rem'}}); dsec.append(cap);
  let rows = [];
  function build(){
    const t = main.trace; wrap.textContent = ''; rows = [];
    const tb = el('tbody');
    const LIM = 400;
    t.steps.slice(0, LIM).forEach((st, i) => {
      const pv = t.steps[i-1];
      const state = Object.keys(st.vars||{}).map(k => { const chg = pv && fmt(pv.vars[k]) !== fmt(st.vars[k]); return (chg ? '<b>' : '') + esc(k+'='+fmt(st.vars[k])) + (chg ? '</b>' : ''); }).join('  ');
      const tr = el('tr', {onclick:() => { main.go(i); main.root.scrollIntoView({block:'start'}); }},
        el('td', {class:'st', text:String(i+1)}), el('td', {class:'st', text: st.line ? String(st.line) : '–'}),
        el('td', {class:'st', html: state || '–'}), el('td', {html: esc(st.msg).replace(/`([^`]+)`/g, '<code>$1</code>')}));
      rows.push(tr); tb.append(tr);
    });
    wrap.append(el('table', {class:'dry'}, el('thead', {}, el('tr', {}, el('th', {text:'#'}), el('th', {text:'Line'}), el('th', {text:'State after step'}), el('th', {text:'What happens'}))), tb));
    const lbl = main.exIndex >= 0 ? ((P.examples[main.exIndex]||{}).label || 'Example') : 'your input';
    cap.textContent = `Dry run of ${lbl}: ${t.steps.length} steps${t.steps.length > LIM ? ` (first ${LIM} shown)` : ''}. Bold values changed on that step.`;
    mark();
  }
  function mark(){ rows.forEach((r, i) => r.classList.toggle('cur', i === main.k)); }
  main.listeners.push((p, kind) => kind === 'step' ? mark() : build());
  build();
})();

// algorithms
(function(){
  const sec = $('#algorithms'); const A = P.algorithms || [];
  head(sec, 'Toolbox', A.length ? 'Special algorithms used' : 'Techniques used', A.length ? null : 'No named algorithm is needed here beyond the approach above.');
  A.forEach((a, i) => {
    const card = el('article', {class:'algo'},
      el('div', {class:'sec-head'}, el('span', {class:'eyebrow', text:a.category || 'Algorithm'}), el('h3', {text:a.name, style:{fontSize:'1.35rem'}}), a.tagline ? el('p', {class:'muted', html:a.tagline}) : null));
    const leftCol = el('div', {style:{display:'grid', gap:'12px', alignContent:'start'}}, el('div', {class:'summary', html:a.explain || ''}));
    if (a.steps) leftCol.append(el('div', {}, el('h3', {text:'How it works', style:{fontSize:'.95rem', marginBottom:'6px'}}), el('ol', {}, a.steps.map(s => el('li', {html:s})))));
    if (a.whenToUse) leftCol.append(el('div', {}, el('h3', {text:'Reach for it when', style:{fontSize:'.95rem', marginBottom:'6px'}}), el('ul', {class:'plain'}, a.whenToUse.map(s => el('li', {html:s})))));
    if (a.pitfalls) leftCol.append(el('div', {}, el('h3', {text:'Common pitfalls', style:{fontSize:'.95rem', marginBottom:'6px'}}), el('ul', {class:'plain'}, a.pitfalls.map(s => el('li', {html:s})))));
    if (a.complexity) leftCol.append(el('div', {class:'cx'}, el('span', {class:'chip mono', text:a.complexity})));
    const rightCol = el('div', {style:{display:'grid', gap:'8px', alignContent:'start', minWidth:0}});
    if (a.template) rightCol.append(el('span', {class:'eyebrow', text:'Reusable template'}), codeBlock(C.parseCode(a.template).lines, 'tpl'));
    card.append(el('div', {class:'grid2'}, leftCol, rightCol));
    if (a.demo) { card.append(el('span', {class:'eyebrow', text:'Mini demo'})); new Player(card, Object.assign({language:P.language}, a.demo), {id:'algo'+i, custom:false, label:a.name+' demo'}); }
    sec.append(card);
  });
})();

// similar
(function(){
  const sec = $('#similar'); head(sec, 'Keep going', 'Similar problems', 'Same family, one twist each. Try the hint before looking anything up.');
  sec.append(el('div', {class:'sim'}, (P.similar||[]).map(q => {
    const hb = el('div', {class:'hintbox', html:q.hint, hidden:true});
    const btn = el('button', {class:'btn', type:'button', onclick:() => { hb.hidden = !hb.hidden; btn.textContent = hb.hidden ? 'Show hint' : 'Hide hint'; }}, 'Show hint');
    return el('article', {class:'scard'},
      q.url ? el('a', {class:'t', href:q.url, target:'_blank', rel:'noopener', text:q.title + ' ↗'}) : el('span', {class:'t', text:q.title}),
      el('div', {class:'row'}, q.difficulty ? el('span', {class:'chip diff '+diffCls(q.difficulty), text:q.difficulty}) : null, q.technique ? el('span', {class:'chip', text:q.technique}) : null),
      el('p', {class:'muted', style:{fontSize:'.9rem'}, html:'<strong style="color:var(--ink)">What changes:</strong> ' + (q.twist || '')}),
      el('div', {style:{display:'grid', gap:'8px'}}, btn, hb));
  })));
})();
document.addEventListener('keydown', e => {
  if (e.defaultPrevented || e.altKey || e.ctrlKey || e.metaKey) return;
  const a = document.activeElement;
  if (a && (/^(INPUT|SELECT|TEXTAREA|BUTTON)$/.test(a.tagName) || a.isContentEditable || a.closest('.player'))) return;
  if (e.key === 'ArrowRight') { e.preventDefault(); main.go(main.k+1); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); main.go(main.k-1); }
});
$('#foot').textContent = 'Problem summary is paraphrased; open the original link for the full statement.';
})();
</script>
