# GitHub Pages builds this repo with Jekyll. index.html uses that build to list every page in
# Visualizers/ and every Markdown note inside a folder (Java_SpringBoot/ and any folder added
# later), and notes.html shows a note alongside the rest of its folder.
#
# Notes are published as the plain .md files and rendered in the browser by notes.html. Letting
# Jekyll render them would first run Liquid over them, which mangles code such as
# `int[][] grid = {{1, 2}, {3, 4}};` and fails the whole build on a stray `{%`.
require_front_matter: true   # keep .md files without front matter as plain files...
readme_index:
  enabled: false             # ...README.md files included

# A Pages site is public even when the repo is private. These stay in the repo but off the site:
# the top-level Markdown files are the repo README and study plans rather than notes. Remove a
# line to publish it.
exclude:
  - README.md
  - DSA_Restart_Plan.md
  - Java_SpringBoot_Prep_Tracker.md
  - System_Design_Prep_Tracker.md
  - "*.pdf"

# index.html carries its own styling, so skip the default theme's stylesheet.
theme: null
